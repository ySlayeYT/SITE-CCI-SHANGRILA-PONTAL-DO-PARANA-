<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema CCI - Pontal do Paraná</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <!-- Cabeçalho Principal -->
    <header class="no-print">
        <div class="header-container">
            <h1>Sistema de Cadastro - CCI Pontal do Paraná</h1>
            <p>Centro de Convivência do Idoso</p>
        </div>
    </header>

    <!-- Menu de Navegação -->
    <nav class="no-print">
        <button id="btn-tab-cadastro" class="active" onclick="switchTab('cadastro')">Nova Ficha</button>
        <button id="btn-tab-lista" onclick="switchTab('lista')">Pesquisar / Listar</button>
    </nav>

    <!-- Conteúdo Principal -->
    <main class="no-print">
        
        <!-- SEÇÃO: CADASTRO -->
        <section id="sec-cadastro" class="tab-content active">
            <h2>Cadastrar Novo Participante</h2>
            <form id="form-cadastro">
                <div class="form-grid">
                    <div class="input-group full-width">
                        <label for="foto">Foto do Participante</label>
                        <input type="file" id="foto" accept="image/*">
                    </div>

                    <div class="input-group">
                        <label for="nome">Nome Completo *</label>
                        <input type="text" id="nome" required>
                    </div>

                    <div class="input-group">
                        <label for="cpf">CPF *</label>
                        <input type="text" id="cpf" required placeholder="000.000.000-00">
                    </div>

                    <div class="input-group">
                        <label for="data_nasc">Data de Nascimento *</label>
                        <input type="date" id="data_nasc" required>
                    </div>

                    <div class="input-group">
                        <label for="ano_inscricao">Ano da Inscrição *</label>
                        <input type="number" id="ano_inscricao" required value="2026">
                    </div>

                    <div class="input-group">
                        <label for="tel_pessoal">Número Pessoal *</label>
                        <input type="tel" id="tel_pessoal" required placeholder="(41) 90000-0000">
                    </div>

                    <div class="input-group">
                        <label for="tel_resp">Número do Responsável *</label>
                        <input type="tel" id="tel_resp" required placeholder="(41) 90000-0000">
                    </div>

                    <div class="input-group">
                        <label for="balneario">Balneário *</label>
                        <input type="text" id="balneario" required placeholder="Ex: Praia de Leste, Ipanema...">
                    </div>

                    <div class="input-group">
                        <label for="endereco">Endereço Completo *</label>
                        <input type="text" id="endereco" required>
                    </div>

                    <div class="input-group">
                        <label for="profissao">Profissão (Ativa ou Aposentado) *</label>
                        <input type="text" id="profissao" required>
                    </div>

                    <div class="input-group">
                        <label for="atividade">Atividade no CCI *</label>
                        <input type="text" id="atividade" required placeholder="Ex: Hidroginástica, Artesanato...">
                    </div>

                    <div class="input-group full-width">
                        <label for="medicamentos">Medicamentos que Toma *</label>
                        <textarea id="medicamentos" rows="3" required placeholder="Liste os medicamentos ou digite 'Nenhum'"></textarea>
                    </div>
                </div>
                <button type="submit" class="btn-submit">Salvar Ficha</button>
            </form>
        </section>

        <!-- SEÇÃO: PESQUISA E LISTAGEM -->
        <section id="sec-lista" class="tab-content">
            <h2>Participantes Cadastrados</h2>
            <div class="search-bar">
                <input type="text" id="search-input" placeholder="Pesquisar por nome..." onkeyup="filtrarLista()">
                <div class="stats">Total: <span id="total-count">0</span> participante(s)</div>
            </div>

            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th>Nome</th>
                            <th>CPF</th>
                            <th>Balneário</th>
                            <th>Atividade</th>
                            <th>Atestados</th>
                            <th>Ações</th>
                        </tr>
                    </thead>
                    <tbody id="tabela-corpo">
                        <!-- Linhas geradas via JS -->
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <!-- ÁREA DE IMPRESSÃO (Oculta na tela, visível apenas no papel) -->
    <div id="print-area">
        <!-- O conteúdo será injetado pelo JavaScript antes de imprimir -->
    </div>

   <script type="module" src="script.js"></script>
</body>
</html>
